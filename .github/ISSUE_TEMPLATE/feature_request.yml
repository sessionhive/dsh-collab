name: Feature request
description: Suggest an improvement (please keep it small)
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? What would you remove in exchange (fewer concepts/settings is a feature)?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Work orders / flow / handoff
        - Acceptance / evidence
        - Memory / index
        - Session lifecycle
        - Board
        - Settings / UI
        - Learning
        - Docs / i18n
        - Other
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: This does not require auto-editing user rules or the constitution
        - label: This does not add hidden automation
        - label: This can be implemented without an LLM call
